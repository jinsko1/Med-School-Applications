name: Deploy recs site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-recs-site.yml"
      - "data/**"
      - "docs/**"
      - "essays/**"
      - "Resume/Resume.pdf"
      - "schools/**"
      - "scripts/enrich_school_metadata.py"
      - "scripts/fetch_school_research_papers.py"
      - "scripts/populate_school_research_notes.py"
      - "scripts/render_review_site.py"
      - "scripts/sync_shared_essay_drafts.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Build review site
        run: |
          python scripts/enrich_school_metadata.py
          python scripts/populate_school_research_notes.py
          python scripts/sync_shared_essay_drafts.py
          python scripts/render_review_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: review
      - id: deployment
        uses: actions/deploy-pages@v5
